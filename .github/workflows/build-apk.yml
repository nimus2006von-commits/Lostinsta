name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Copy APK with clean name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Direkt-1.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: direkt-apk
          path: Direkt-1.1.apk
          if-no-files-found: error

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create v1.1 Direkt-1.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Direkt v1.1" \
            --notes "Instagram brez feeda: sporočila, profili in stories; home feed, Reels in Explore so blokirani. Novost: pošiljanje slik v pogovorih." \
            --latest
